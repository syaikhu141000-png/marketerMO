<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MO2 Monitor</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#14181f; --mute:#667085; --line:#e4e7ec;
  --accent:#2563eb; --good:#16a34a; --warn:#d97706; --bad:#dc2626;
  --good-bg:#e8f7ee; --warn-bg:#fdf1de; --bad-bg:#fdeaea; --chip:#eef1f6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1117; --card:#161b22; --ink:#e6edf3; --mute:#8b949e; --line:#262d36;
  --accent:#58a6ff; --good:#3fb950; --warn:#e3a008; --bad:#f85149;
  --good-bg:#12261a; --warn-bg:#2a2110; --bad-bg:#2d1517; --chip:#1f2630;}}
:root[data-theme="dark"]{
  --bg:#0d1117; --card:#161b22; --ink:#e6edf3; --mute:#8b949e; --line:#262d36;
  --accent:#58a6ff; --good:#3fb950; --warn:#e3a008; --bad:#f85149;
  --good-bg:#12261a; --warn-bg:#2a2110; --bad-bg:#2d1517; --chip:#1f2630;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:1.35rem;margin:0}
.sub{color:var(--mute);font-size:.85rem;margin-top:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .lbl{color:var(--mute);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-size:1.55rem;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.delta{font-size:.8rem;font-weight:600}
.delta.good{color:var(--good)} .delta.bad{color:var(--bad)} .delta.flat{color:var(--mute)}
h2{font-size:1rem;margin:0 0 10px}
.two{grid-template-columns:1fr 1fr}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.chartbox{position:relative;height:260px}
.flags{margin-bottom:14px}
.flag{display:flex;gap:10px;padding:9px 12px;border-radius:8px;margin-bottom:8px;font-size:.9rem;align-items:flex-start}
.flag.bad{background:var(--bad-bg)} .flag.warn{background:var(--warn-bg)} .flag.good{background:var(--good-bg)}
.flag b{white-space:nowrap}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:240px;max-width:420px}
th{color:var(--mute);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:var(--card)}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.74rem;font-weight:600;background:var(--chip)}
.badge.good{background:var(--good-bg);color:var(--good)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.bad{background:var(--bad-bg);color:var(--bad)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tools input{flex:1;min-width:160px}
.note{color:var(--mute);font-size:.8rem;margin-top:18px}
.err{padding:16px;border-radius:10px;background:var(--bad-bg);color:var(--bad)}
section{margin-bottom:14px}
@media(max-width:560px){.flag{flex-direction:column;gap:2px}.kpi .val{font-size:1.3rem}}
.more{margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">MO2 Monitor</h1>
      <div class="sub" id="sub">Memuatkan data…</div>
    </div>
    <div class="btns">
      <button id="reload">Papar semula</button>
      <button id="theme">Tema</button>
    </div>
  </header>

  <div id="root"></div>
  <div class="note" id="note"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function(){
const WINDOWS=[[1,"Semalam"],[3,"3 hari"],[7,"7 hari"],[14,"14 hari"],[30,"30 hari"]];
let DATA=null, CFG={cpl_good:15,cpl_max:30,waste_multiplier:3}, WIN=7, charts=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=(n,d=0)=>Number(n).toLocaleString("en-MY",{minimumFractionDigits:d,maximumFractionDigits:d});
const rm=n=>n==null?"—":"RM"+nf(n,2);
const cpr=(s,r)=>r>0?s/r:null;

function sum(rows){
  const t={spend:0,results:0,impressions:0,clicks:0};
  rows.forEach(r=>{t.spend+=r.spend;t.results+=r.results;t.impressions+=r.impressions;t.clicks+=r.clicks;});
  t.cpr=cpr(t.spend,t.results);
  t.ctr=t.impressions?t.clicks/t.impressions*100:null;
  t.cpm=t.impressions?t.spend/t.impressions*1000:null;
  return t;
}
function windowRows(n){const d=DATA.daily;return {cur:d.slice(-n),prev:d.length>=2*n?d.slice(-2*n,-n):null};}

function badge(v){
  if(v==null) return '<span class="badge">—</span>';
  const c=v<=CFG.cpl_good?"good":v<=CFG.cpl_max?"warn":"bad";
  return `<span class="badge ${c}">${rm(v)}</span>`;
}
function delta(cur,prev,lowerBetter,unit){
  if(prev==null||cur==null||prev===0) return '<span class="delta flat">tiada perbandingan</span>';
  const p=(cur-prev)/prev*100;
  if(Math.abs(p)<0.5) return '<span class="delta flat">≈ sama</span>';
  const better=lowerBetter?p<0:p>0;
  return `<span class="delta ${lowerBetter===null?"flat":better?"good":"bad"}">${p>0?"▲":"▼"} ${nf(Math.abs(p),1)}% vs tempoh sebelum</span>`;
}

function kpis(){
  const {cur,prev}=windowRows(WIN), c=sum(cur), p=prev?sum(prev):null;
  const items=[
    ["Spend",rm(c.spend),delta(c.spend,p&&p.spend,null)],
    ["Hasil",nf(c.results),delta(c.results,p&&p.results,false)],
    ["RM / hasil",rm(c.cpr),delta(c.cpr,p&&p.cpr,true)],
    ["CTR",c.ctr==null?"—":nf(c.ctr,2)+"%",delta(c.ctr,p&&p.ctr,false)],
    ["CPM",rm(c.cpm),delta(c.cpm,p&&p.cpm,true)],
  ];
  return `<div class="grid kpis">${items.map(i=>`<div class="card kpi"><div class="lbl">${i[0]}</div><div class="val">${i[1]}</div>${i[2]}</div>`).join("")}</div>`;
}

function flags(){
  const out=[], d=DATA.daily;
  const w7=sum(d.slice(-7)), w3=sum(d.slice(-3)), y=d[d.length-1];
  if(w7.cpr!=null){
    out.push(w7.cpr>CFG.cpl_max
      ?["bad","RM/hasil 7 hari",`${rm(w7.cpr)} — melebihi had RM${CFG.cpl_max}.`]
      :w7.cpr>CFG.cpl_good?["warn","RM/hasil 7 hari",`${rm(w7.cpr)} — dalam had RM${CFG.cpl_max} tapi di atas sasaran RM${CFG.cpl_good}.`]
      :["good","RM/hasil 7 hari",`${rm(w7.cpr)} — dalam sasaran.`]);
  }
  if(w3.cpr!=null&&w7.cpr!=null&&w3.cpr>w7.cpr*1.25)
    out.push(["warn","Trend naik",`RM/hasil 3 hari (${rm(w3.cpr)}) lebih tinggi 25%+ berbanding 7 hari (${rm(w7.cpr)}).`]);
  const avg7=w7.spend/7;
  if(y&&avg7>0&&y.spend<avg7*0.5)
    out.push(["warn","Spend turun",`Spend terakhir ${rm(y.spend)} kurang separuh daripada purata 7 hari (${rm(avg7)}). Semak kempen yang Paused.`]);
  const active=DATA.campaigns.filter(c=>c.status==="ACTIVE");
  if(!active.length) out.push(["bad","Tiada kempen Active","Semua kempen Paused."]);
  else if(active.every(c=>c.results===0)) out.push(["bad","Tiada hasil dari kempen Active",`Kempen Active (${active.map(c=>esc(c.name)).join(", ")}) tiada hasil lead. Kempen lead semua Paused?`]);
  const limit=CFG.waste_multiplier*CFG.cpl_max;
  const waste=DATA.ads.filter(a=>a.results===0&&a.spend>=limit).sort((a,b)=>b.spend-a.spend);
  if(waste.length) out.push(["bad","Pembazir (7 hari)",`${waste.length} ad spend ≥ ${rm(limit)} tanpa hasil, jumlah ${rm(waste.reduce((s,a)=>s+a.spend,0))}: ${waste.slice(0,4).map(a=>esc(a.name.slice(0,40))+" ("+rm(a.spend)+")").join("; ")}${waste.length>4?"…":""}`]);
  const zero=DATA.ads.filter(a=>a.results===0&&a.spend>0), zs=zero.reduce((s,a)=>s+a.spend,0);
  out.push(["warn","Ad tanpa hasil",`${zero.length} ad (7 hari) = ${rm(zs)} (${nf(w7.spend?zs/(DATA.ads.reduce((s,a)=>s+a.spend,0))*100:0,1)}% spend ad).`]);
  return `<section class="card flags"><h2>Red flag</h2>${out.map(f=>`<div class="flag ${f[0]}"><b>${f[1]}</b><span>${f[2]}</span></div>`).join("")}</section>`;
}

function campTable(){
  const rows=[...DATA.campaigns].sort((a,b)=>b.spend-a.spend);
  return `<section class="card"><h2>Kempen (7 hari)</h2><div class="tbl"><table>
  <tr><th>Kempen</th><th>Status</th><th>Spend</th><th>Hasil</th><th>RM/hasil</th><th>CTR</th><th>CPM</th></tr>
  ${rows.map(r=>{const t=sum([r]);return `<tr><td>${esc(r.name)}</td><td><span class="badge ${r.status==="ACTIVE"?"good":""}">${esc(r.status)}</span></td><td>${rm(r.spend)}</td><td>${r.results}</td><td>${badge(t.cpr)}</td><td>${t.ctr==null?"—":nf(t.ctr,2)+"%"}</td><td>${rm(t.cpm)}</td></tr>`}).join("")}
  </table></div></section>`;
}

let adFilter="all", adQuery="", adAll=false;
const AD_LIMIT=25;
function adRows(){
  return [...DATA.ads].filter(a=>adFilter==="all"||(adFilter==="hasil"?a.results>0:a.results===0))
    .filter(a=>!adQuery||a.name.toLowerCase().includes(adQuery)||a.campaign.toLowerCase().includes(adQuery))
    .sort((a,b)=>b.spend-a.spend);
}
function adBody(){
  const all=adRows(), shown=adAll?all:all.slice(0,AD_LIMIT);
  const mb=$("#adMore"); if(mb){mb.style.display=all.length>AD_LIMIT?"":"none"; mb.textContent=adAll?"Tunjuk 25 teratas sahaja":"Tunjuk semua "+all.length+" ad";}
  return shown.map(r=>{const t=sum([r]);return `<tr><td>${esc(r.name)}<div class="sub">${esc(r.campaign)}</div></td><td>${rm(r.spend)}</td><td>${r.results}</td><td>${badge(t.cpr)}</td><td>${t.ctr==null?"—":nf(t.ctr,2)+"%"}</td><td>${rm(t.cpm)}</td></tr>`}).join("")||'<tr><td colspan="6">Tiada ad.</td></tr>';
}
function adTable(){
  return `<section class="card"><h2>Ad (7 hari)</h2>
  <div class="tools"><input id="q" placeholder="Cari nama ad / kempen"><select id="f"><option value="all">Semua</option><option value="hasil">Ada hasil</option><option value="kosong">0 hasil</option></select></div>
  <div class="tbl"><table><thead><tr><th>Ad</th><th>Spend</th><th>Hasil</th><th>RM/hasil</th><th>CTR</th><th>CPM</th></tr></thead><tbody id="adbody"></tbody></table></div><button class="more" id="adMore"></button></section>`;
}

function charts_(){
  charts.forEach(c=>c.destroy());charts=[];
  if(!window.Chart) return;
  const d=DATA.daily, labels=d.map(r=>r.date.slice(5));
  const css=getComputedStyle(document.documentElement);
  const accent=css.getPropertyValue("--accent").trim(), mute=css.getPropertyValue("--mute").trim(), line=css.getPropertyValue("--line").trim(),
        good=css.getPropertyValue("--good").trim(), bad=css.getPropertyValue("--bad").trim(), warn=css.getPropertyValue("--warn").trim();
  const base={responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
    plugins:{legend:{labels:{color:mute,boxWidth:12}}},
    scales:{x:{ticks:{color:mute,maxTicksLimit:10},grid:{color:line}}}};
  charts.push(new Chart($("#c1"),{data:{labels,datasets:[
    {type:"bar",label:"Spend (RM)",data:d.map(r=>r.spend),backgroundColor:accent+"99",yAxisID:"y"},
    {type:"line",label:"Hasil",data:d.map(r=>r.results),borderColor:good,backgroundColor:good,tension:.25,pointRadius:2,yAxisID:"y1"}]},
    options:{...base,scales:{...base.scales,y:{ticks:{color:mute},grid:{color:line}},y1:{position:"right",ticks:{color:mute},grid:{display:false}}}}}));
  const cp=d.map(r=>r.results>0?+(r.spend/r.results).toFixed(2):null);
  charts.push(new Chart($("#c2"),{type:"line",data:{labels,datasets:[
    {label:"RM / hasil",data:cp,borderColor:accent,backgroundColor:accent,tension:.25,pointRadius:2,spanGaps:true},
    {label:"Sasaran "+CFG.cpl_good,data:d.map(()=>CFG.cpl_good),borderColor:good,borderDash:[6,4],pointRadius:0},
    {label:"Had "+CFG.cpl_max,data:d.map(()=>CFG.cpl_max),borderColor:bad,borderDash:[6,4],pointRadius:0}]},
    options:{...base,scales:{...base.scales,y:{beginAtZero:true,max:CFG.cpl_max*3,ticks:{color:mute},grid:{color:line}}}}}));
}

function render(){
  const m=DATA.meta;
  $("#title").textContent=m.account_name+" — Pantas Baca Monitor";
  const g=new Date(m.generated_at);
  $("#sub").textContent="Dikemas kini "+g.toLocaleString("ms-MY",{dateStyle:"medium",timeStyle:"short"})+" · data sehingga "+DATA.daily[DATA.daily.length-1].date;
  $("#note").textContent=m.note+" Garis rujukan RM"+CFG.cpl_good+" / RM"+CFG.cpl_max+" boleh diubah dalam config.json.";
  $("#root").innerHTML=
    `<div class="tabs">${WINDOWS.map(w=>`<button data-w="${w[0]}" class="${w[0]===WIN?"on":""}">${w[1]}</button>`).join("")}</div>`+
    kpis()+flags()+
    `<div class="grid two" style="margin-bottom:14px"><section class="card"><h2>Spend &amp; hasil harian (30 hari)</h2><div class="chartbox"><canvas id="c1"></canvas></div></section>
     <section class="card"><h2>RM / hasil harian <span class="sub">(paksi dipotong pada RM${CFG.cpl_max*3}; hover untuk nilai sebenar)</span></h2><div class="chartbox"><canvas id="c2"></canvas></div></section></div>`+
    campTable()+adTable();
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{WIN=+b.dataset.w;render();});
  $("#adbody").innerHTML=adBody();
  $("#adMore").onclick=()=>{adAll=!adAll;$("#adbody").innerHTML=adBody();};
  $("#f").value=adFilter;$("#q").value=adQuery;
  $("#f").onchange=e=>{adFilter=e.target.value;$("#adbody").innerHTML=adBody();};
  $("#q").oninput=e=>{adQuery=e.target.value.toLowerCase();$("#adbody").innerHTML=adBody();};
  charts_();
}

async function load(){
  $("#sub").textContent="Memuatkan data…";
  try{
    const [d,c]=await Promise.all([
      fetch("data.json?_="+Date.now()).then(r=>{if(!r.ok)throw new Error("data.json "+r.status);return r.json();}),
      fetch("config.json?_="+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({}))]);
    DATA=d;CFG={...CFG,...c};render();
  }catch(e){
    $("#root").innerHTML='<div class="err">Gagal muat data: '+esc(e.message)+'. Buka melalui http(s) (cth. GitHub Pages atau <code>python3 -m http.server</code> dalam folder dashboard), bukan dengan double-click fail.</div>';
    $("#sub").textContent="";
  }
}
$("#reload").onclick=load;
$("#theme").onclick=()=>{
  const r=document.documentElement, dark=getComputedStyle(r).getPropertyValue("--bg").trim()==="#0d1117";
  r.dataset.theme=dark?"light":"dark";
  try{localStorage.setItem("mo2-theme",r.dataset.theme);}catch(e){}
  if(DATA) charts_();
};
try{const t=localStorage.getItem("mo2-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}
load();
})();
</script>
</body>
</html>
