name: Tarik data MO2 (harian)
# Enjin percuma: tarik data Meta setiap pagi dan simpan ke Cloudflare KV. Dashboard: https://mo2-dashboard.syaikhu141000.workers.dev/
on:
  schedule:
    - cron: "7 21 * * *"   # 5:07 pagi waktu Malaysia (GitHub kadang lewat 5-30 minit)
  workflow_dispatch:        # butang "Run workflow" untuk tarik sekarang
permissions:
  contents: write
concurrency: mo2-refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      META_AD_ACCOUNT_ID: act_863467445706037
      META_API_VERSION: v23.0
      CF_ACCOUNT_ID: a2d37374902cc6be7820107d67823576
      CF_KV_NAMESPACE_ID: 41268308218948c3b8f93ec4ec091664
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tarik data Meta & simpan ke Cloudflare
        run: node worker/run_build.mjs
      - name: Heartbeat (supaya GitHub tak matikan jadual selepas 60 hari tanpa aktiviti)
        if: always()
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add docs/last_run.json
          git diff --cached --quiet || (git commit -m "Heartbeat: tarik data MO2" && git push)
