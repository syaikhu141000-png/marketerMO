name: Alert Iklan MO2 (phone)

# Jalan setiap jam (UTC). Hantar notifikasi ke phone HANYA bila ada isu.
# Setup secrets: GitHub → Settings → Secrets and variables → Actions:
#   META_ACCESS_TOKEN  — token Meta (System User, ads_read)
#   NTFY_TOPIC         — nama topic ntfy rahsia kau
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Semak isu iklan & hantar alert
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          META_AD_ACCOUNT_ID: act_863467445706037
          META_API_VERSION: v23.0
        run: python3 scripts/alert_notify.py
